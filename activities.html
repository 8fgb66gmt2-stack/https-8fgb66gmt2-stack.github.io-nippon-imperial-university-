<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生課外活動記録</title><style>body{background:#120f0d;color:#dfd2bc;font-family:serif;margin:0}main{max-width:850px;margin:auto;padding:45px 20px}h1{font-weight:400;color:#c9a966}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #715b3d;background:#1b1714;padding:20px}.card a{color:#d4b66f}.seal{margin-top:30px;border:1px dashed #765e3d;padding:20px;text-align:center}</style><main><small>日ノ本帝國國立帝國大學｜學生課外活動記録</small><h1>非公式・遊戯資料室</h1><p>公式索引には掲載されていない課外遊戯。すべての遊戯は、次の記録を一つずつ隠している。</p><div class="grid"><div class="card"><h2>壹　活動寫眞館</h2><p>失われた一コマを探せ。</p><a href="film-game.html">映写機を起動</a></div><div class="card"><h2>貳　暗号郵便</h2><p>帝國電信を復号せよ。</p><a href="telegraph-game.html">電信室へ</a></div><div class="card"><h2>參　時計塔</h2><p>鐘を正しい時刻へ。</p><a href="clock-game.html">時計塔へ</a></div><div class="card"><h2>肆　紅い譜面</h2><p>旋律から文字を取り出せ。</p><a href="score-game.html">音樂室へ</a></div><div class="card"><h2>伍　404號室</h2><p>存在しない部屋を探せ。</p><a href="room404.html">廊下を歩く</a></div><div class="card"><h2>陸　地下資料室</h2><p>全遊戯の鍵を集めた者へ。</p><a href="underground.html">階段を降りる</a></div></div><div class="seal">「娯楽は、記録を隠すための最も古い方法である。」</div></main></html>
