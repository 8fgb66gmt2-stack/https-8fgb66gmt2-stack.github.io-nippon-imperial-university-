<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>娯楽室｜日ノ本帝國國立帝國大學</title><style>body{margin:0;background:#120f0d;color:#e7dcc8;font-family:serif;text-align:center}main{max-width:820px;margin:auto;padding:55px 20px}.card{border:1px solid #9b7d4b;background:#1d1814;padding:28px;margin:22px 0}.game{padding:12px;margin:8px;border:1px solid #715b3b;background:#171310;color:#e3c98f;cursor:pointer}.hidden{display:none}.terminal{background:#050505;color:#9db49a;padding:20px;text-align:left;font-family:monospace;min-height:120px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:300px;margin:20px auto}.cell{aspect-ratio:1;border:1px solid #6e5939;background:#211b16;cursor:pointer}.cell.on{background:#b89a61}</style></head><body><main><p>日ノ本帝國國立帝國大學｜学生娯楽室</p><h1>非公式娯楽記録</h1><div class="card"><h2>ゲーム壹　記憶遊戯</h2><p>三秒だけ表示される数字を記憶せよ。</p><button class="game" onclick="memory()">開始</button><div id="m"></div></div><div class="card"><h2>ゲーム貳　五×五灯籠</h2><p>全ての灯籠を消せ。ただし、押した灯籠と上下左右が反転する。</p><div id="b" class="board"></div><p id="status"></p></div><div class="card"><h2>ゲーム參　研究端末</h2><div class="terminal" id="t">R-17 TERMINAL<br>&gt; type: HELP</div><input id="cmd" placeholder="コマンド"><button class="game" onclick="terminal()">実行</button></div><div class="card hidden" id="secret"><h2>？？？</h2><p>三つの遊戯を突破した者だけが閲覧できる。</p><p>「娯楽は、記録を隠すための最も古い方法だった。」</p><a href="achievement21.html">次の記録へ</a></div></main><script>let solved=[false,false,false];function memory(){let n=Math.floor(Math.random()*9000+1000);let m=document.getElementById('m');m.innerHTML='<b>'+n+'</b>';setTimeout(()=>{m.innerHTML='<input id="mi" placeholder="数字"><button class="game" onclick="mc('+n+')">照合</button>'},3000)}function mc(n){if(document.getElementById('mi').value==n){solved[0]=true;document.getElementById('m').textContent='記憶照合：成功';check()}else document.getElementById('m').textContent='失敗。もう一度。'}let cells=[];function setup(){let b=document.getElementById('b');for(let i=0;i<25;i++){let x=document.createElement('div');x.className='cell';x.onclick=()=>flip(i);b.appendChild(x);cells.push(x)}[2,5,7,11,14,19,22].forEach(i=>cells[i].classList.add('on'))}function flip(i){[i,i-1,i+1,i-5,i+5].forEach(j=>{if(j>=0&&j<25&&Math.floor(j/5)===Math.floor(i/5)||j===i||j===i-5||j===i+5)cells[j].classList.toggle('on')});if(cells.every(x=>!x.classList.contains('on'))){solved[1]=true;document.getElementById('status').textContent='全灯消灯。照合成功。';check()}}function terminal(){let c=document.getElementById('cmd').value.trim().toUpperCase(),t=document.getElementById('t');if(c==='HELP')t.innerHTML+='\n> ARCHIVE / STATUS / 0318 / 0320';else if(c==='STATUS')t.innerHTML+='\nACCESS: STUDENT\nRECORD: INCOMPLETE';else if(c==='0318')t.innerHTML+='\n欠番。隣接番号を探せ。';else if(c==='0320'){t.innerHTML+='\n照合成功。R-17閉鎖記録を解除。';solved[2]=true;check()}else t.innerHTML+='\nUNKNOWN COMMAND';document.getElementById('cmd').value=''}function check(){if(solved.every(Boolean))document.getElementById('secret').classList.remove('hidden')}setup();</script></body></html>
