<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>日ノ本帝國國立帝國大學｜公式Webサイト</title><style>body{margin:0;background:#f3ecde;color:#241c1b;font-family:serif}#entrance{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#382422,#140e0e);color:#f2e7d3;transition:opacity .8s,visibility .8s}.entrance-inner{width:min(90%,420px);text-align:center}.entrance-mark{font-size:55px;color:#dbc48e}.entrance-title{font-size:22px;letter-spacing:.2em}.entrance-sub{margin-top:10px;font-size:9px;letter-spacing:.3em;opacity:.65}.entrance-line{width:150px;height:1px;margin:25px auto;background:#a98545}.entrant-registration{margin:0 auto 20px;text-align:left}.entrant-registration label{display:block;text-align:center;font-size:10px;letter-spacing:.22em;color:#d7c8b3;margin-bottom:9px}.entrant-registration input{display:block;width:100%;padding:13px 14px;box-sizing:border-box;background:rgba(0,0,0,.3);border:1px solid #a98545;color:#f5ead8;font-family:inherit;font-size:16px;text-align:center;outline:none}.entrant-registration input:focus{box-shadow:0 0 0 2px rgba(219,196,142,.25);border-color:#dbc48e}.entrant-note{font-size:8px;letter-spacing:.12em;color:#cdbfae;margin-top:8px;text-align:center;opacity:.72}.entrance-enter{border:1px solid #a98545;background:transparent;color:#f5ead7;padding:12px 28px;cursor:pointer;letter-spacing:.2em;font-family:inherit}.entrance-enter:hover{background:#a98545;color:#241918}.error{color:#dbc48e!important}.welcome{max-width:1000px;margin:80px auto;padding:30px;text-align:center}.welcome h1{font-size:32px;letter-spacing:.15em}.welcome p{line-height:2}</style></head><body>
<div id="entrance"><div class="entrance-inner">
<div class="entrance-mark">❦</div><div class="entrance-title">日ノ本帝國國立帝國大學</div><div class="entrance-sub">NIHON IMPERIAL UNIVERSITY</div><div class="entrance-line"></div>
<div class="entrant-registration"><label for="entrant-name">入學者登録</label><input id="entrant-name" name="entrant-name" type="text" maxlength="24" autocomplete="off" placeholder="氏名を入力してください" aria-label="入學者名"><div class="entrant-note">記録はこの端末にのみ保存されます</div></div>
<button class="entrance-enter" id="enterButton" type="button">帝國大學へ入場する</button>
</div></div>
<main class="welcome"><h1>日ノ本帝國國立帝國大學</h1><p>帝國大學公式Webサイトへようこそ。</p><p id="entrantWelcome"></p></main>
<script>(function(){const KEY='niu_entrant_name';const input=document.getElementById('entrant-name');const btn=document.getElementById('enterButton');const entrance=document.getElementById('entrance');const welcome=document.getElementById('entrantWelcome');const saved=localStorage.getItem(KEY);if(saved)input.value=saved;function enter(){const name=input.value.trim();if(!name){input.classList.add('error');input.placeholder='入學者名を入力してください';input.focus();setTimeout(()=>input.classList.remove('error'),900);return}localStorage.setItem(KEY,name);welcome.textContent='入學者『'+name+'』として登録されました。';entrance.style.opacity='0';entrance.style.visibility='hidden';setTimeout(()=>entrance.remove(),850)}input.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});btn.addEventListener('click',enter);})();</script>
