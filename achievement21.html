<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録21｜閲覧者名簿</title><style>body{background:#0b0b0b;color:#d9cfbd;font-family:serif;margin:0}main{max-width:760px;margin:auto;padding:55px 20px}.box{border:1px solid #8b7144;padding:28px;background:#171411}input,button{padding:12px;margin:5px;background:#eee7da;border:1px solid #9b7d4b}button{cursor:pointer}.secret{display:none;color:#c7a96a}.red{color:#bd6d73}</style></head><body><main><div class="box"><small>中央研究資料室｜閲覧記録 21</small><h1>閲覧者名簿</h1><p>娯楽室の三遊戯を突破した閲覧者へ。</p><p>あなたは大学の資料を読むだけではなく、大学の「記録」に触れました。</p><p>名簿に名前を残してください。</p><input id="name" placeholder="閲覧者名"><button onclick="reg()">登録</button><div id="out"></div><div id="s" class="secret"><hr><p class="red">登録完了。</p><p>登録番号：R-21-0319</p><p>所属：日ノ本帝國國立帝國大學（記録上）</p><p>状態：<b>閲覧者ではなく研究対象</b></p><p>――「名前を書いた瞬間から、記録はあなたを読む。」</p></div></div></main><script>function reg(){let n=document.getElementById('name').value.trim();if(!n)return;localStorage.setItem('argVisitor',n);document.getElementById('out').textContent='名簿照合中……';setTimeout(()=>document.getElementById('s').style.display='block',700)}</script></body></html>
