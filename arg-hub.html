<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帝國大學・秘匿資料室</title><style>body{margin:0;background:#201615;color:#eadfcf;font-family:serif;min-height:100vh;display:grid;place-items:center}.box{width:min(820px,90vw);padding:45px;border:1px solid #a98545;box-shadow:0 0 0 7px #201615,0 0 0 8px #781722;text-align:center}h1{color:#dbc48e;letter-spacing:.15em}.k{color:#a98545;font-size:11px;letter-spacing:.3em}.links{display:grid;gap:14px;margin-top:30px}.links a,button{padding:15px;border:1px solid #80643a;color:#eadfcf;text-decoration:none;background:#2d201e;font-family:serif;cursor:pointer}.links a:hover,button:hover{background:#4c0d14}.hint{margin-top:30px;color:#a99b8c;font-size:12px}.panel{display:none;margin-top:25px;text-align:left;padding:20px;border:1px dashed #80643a;background:#171111}.panel.show{display:block}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.msg{min-height:28px;color:#dbc48e;margin-top:15px}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main class="box"><div class="k">N.I.U. / SECRET ARG ARCHIVE</div><h1>帝國大學・秘匿資料室</h1><p>公開記録の裏側に、まだ閲覧されてゐない頁がある。</p><div class="links"><a href="archive16.html">ARCHIVE 16・反転頁</a><a href="index.html#archive">第十三號文藝調査記録へ戻る</a></div><section class="panel show"><h2>夜間閲覧・追加記録</h2><p>三つの印を、資料に現れた順に戻せ。</p><div class="choices"><button data-k="daisy">雛菊</button><button data-k="kaoruko">薫子</button><button data-k="maku">眞紅</button></div><div id="msg" class="msg"></div></section><section id="secret" class="panel"><h2>第十六號・余白記録</h2><p>「名を読むな。名の前に置かれたものを読め。」</p><p>雛・薫・眞</p><p>次の手掛かり：<strong>十年戻らぬ春</strong></p><p><a href="archive16.html">反転頁を開く</a></p></section><p class="hint">「十年戻らぬ春を、もう一度探せ。」</p></main><script>const order=['daisy','kaoruko','maku'];let p=0;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.k!==order[p]){p=0;document.getElementById('msg').textContent='順序が違ふ。記録は沈黙した。';return}b.disabled=true;p++;document.getElementById('msg').textContent=p===3?'三つの印が揃つた。余白記録が開く。':'記録片 '+p+' / 3 を確認。';if(p===3)document.getElementById('secret').classList.add('show')});</script></body></html>
