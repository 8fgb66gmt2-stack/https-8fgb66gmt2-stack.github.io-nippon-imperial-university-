<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時計塔</title><style>body{background:#0e0c0b;color:#d9c8a7;font-family:serif;text-align:center;padding:45px}.clock{font-size:70px;border:1px solid #80663f;padding:30px;display:inline-block}button{padding:12px;margin:5px}</style><h1>時計塔・午前零時</h1><p>針を動かし、禁じられた時刻を作れ。</p><div class="clock" id="c">11:55</div><br><button onclick="add(1)">分針 +1</button><button onclick="add(5)">分針 +5</button><button onclick="add(-5)">分針 -5</button><button onclick="ok()">鐘を鳴らす</button><p id="m"></p><script>let min=55;function draw(){c.textContent='11:'+String((min+60)%60).padStart(2,'0')}function add(x){min=(min+x+60)%60;draw()}function ok(){if(min===0){m.textContent='鐘が三度鳴った。時刻鍵：0000';localStorage.setItem('game_clock','true')}else m.textContent='まだ時刻が違う。'}draw()</script>
