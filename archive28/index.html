<script>
(function(){
  const input=document.getElementById('entrant-name');
  if(!input) return;
  const enter=document.querySelector('.entrance-enter');
  if(enter){
    enter.addEventListener('click',function(e){
      const name=input.value.trim();
      if(!name) return;
      if(window.NIUProfiles) window.NIUProfiles.activate(name);
    },true);
  }
})();
</script>
