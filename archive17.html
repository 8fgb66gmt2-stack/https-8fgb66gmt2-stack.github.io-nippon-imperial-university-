</head><body><main><small>N.I.U. / CONFIDENTIAL ARCHIVE / DOCUMENT 17</small><h1>ARCHIVE 17・春暦記録</h1><p>帝國大學文科附属資料室　旧暦調査綴</p><div class="paper"><p>反転頁より転記。</p><p><strong>「春を探すなら、暦ではなく記録を見よ。」</strong></p><p>十年戻らぬ春――その年だけ、資料室の記録には奇妙な空白がある。</p></div><p>四つの年のうち、ひとつだけ記録の季節が一致しない。</p><div class="years"><button class="year" data-y="1907">一九〇七</button><button class="year" data-y="1917">一九一七</button><button class="year" data-y="1922">一九二二</button><button class="year" data-y="1932">一九三二</button></div><div id="result" class="result"></div><p class="whisper">資料室註：「年」を探してゐると思つた時点で、もう一度第一頁へ戻れ。</p><p><a href="archive16.html" style="color:#d7b777">ARCHIVE 16へ戻る</a></p></main><script>const r=document.getElementById('result');document.querySelectorAll('.year').forEach(b=>b.onclick=()=>{const y=b.dataset.y;if(y==='1922'){r.className='result show';r.innerHTML='<h2>記録の空白</h2><p>正解――ではない。</p><p>一九二二年には「春」の記述が三度ある。</p><p>しかし、その三つとも<strong>同じ人物の筆跡</strong>ではない。</p><p>余白に赤鉛筆で一字だけ残る。</p><p style="font-size:1.5em;color:#781722">「誰が書いた？」</p><p>次の頁は、年ではなく<strong>筆跡</strong>を探す者に開く。</p>'}else{r.className='result show';r.textContent='その年ではない。記録は沈黙してゐる。'}});</script></body></html>
