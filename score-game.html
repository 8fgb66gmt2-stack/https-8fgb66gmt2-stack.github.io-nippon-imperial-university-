<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紅い譜面</title><style>body{background:#160f10;color:#e0d2bd;font-family:serif;text-align:center;padding:45px}.note{display:inline-block;border:1px solid #78505a;padding:18px;margin:5px;cursor:pointer;font-size:25px}.on{background:#6e2833}</style><h1>紅い譜面</h1><p>譜面に残された七つの音を、正しい順序で奏でよ。</p><div id="notes"></div><p id="m"></p><script>let seq=['レ','ド','ミ','ド','ラ','ソ','ド'],pos=0;let n=document.getElementById('notes');['ド','レ','ミ','ファ','ソ','ラ','シ'].forEach(x=>{let b=document.createElement('span');b.className='note';b.textContent=x;b.onclick=()=>{if(x===seq[pos]){b.classList.add('on');pos++;if(pos===seq.length){m.textContent='演奏成功。旋律鍵：KAMISHIRO';localStorage.setItem('game_score','true')}}else{pos=0;document.querySelectorAll('.note').forEach(z=>z.classList.remove('on'));m.textContent='音を外した。最初から。'}};n.appendChild(b)})</script>
