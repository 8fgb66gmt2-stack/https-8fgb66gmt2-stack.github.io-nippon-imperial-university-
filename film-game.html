<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動寫眞館</title><style>body{background:#111;color:#ddd2bd;font-family:serif;text-align:center;padding:35px}#film{max-width:700px;margin:30px auto;padding:40px;border:8px solid #302b24;background:#050505;min-height:180px}button{padding:12px;margin:6px}</style><h1>活動寫眞館</h1><p>映写機は八枚のコマを映す。欠けた一枚だけを選べ。</p><div id="film"></div><div id="buttons"></div><p id="msg"></p><script>const frames=['帝國大學正門','時計塔','旧講堂','図書館','神代聖研究室','紅城院研究室','空白の一枚','地下階段'];let target=6;let f=document.getElementById('film'),b=document.getElementById('buttons');f.textContent='映写中……';setTimeout(()=>{f.textContent='第七號コマが欠落しています。';frames.forEach((x,i)=>{let q=document.createElement('button');q.textContent='第'+(i+1)+'號';q.onclick=()=>{document.getElementById('msg').textContent=i===target?'欠落コマを発見。鍵：FILM-07':'違うコマだ。';if(i===target)localStorage.setItem('game_film','true')};b.appendChild(q)})},700)</script>
