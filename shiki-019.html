<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIKI-019 / RETURN</title><style>body{background:#0e0d0b;color:#ddd2c0;font-family:serif}main{max-width:760px;margin:auto;padding:70px 24px;text-align:center}.box{border:1px solid #806c4d;padding:35px;background:#171411}a{color:#c8a875}.hidden{display:none}</style></head><body><main><div class="box"><small>N.I.U. / CONFIDENTIAL ARCHIVE</small><h1>資料番号 SHIKI-019</h1><h2>帰還者について</h2><p>――誰が帰還したのか。</p><p>SHIKI-018の黒塗り資料をすべて復元した閲覧者へ。</p><p>記録上、帰還した者は一名。</p><p id="name">しかし、名前は記録されていない。</p><button onclick="r()">記録を照合する</button><div id="next" class="hidden"><hr><p>照合結果：<strong>RETURN / 0000</strong></p><p>「帰還」は人物の移動を意味しない。</p><p>失われたものが、元の記録へ戻ること。</p><a href="index.html">帝國大學首頁へ戻る</a></div></div></main><script>function r(){document.getElementById('name').textContent='照合結果：花葉雛菊――ただし、人格記録は一致しません。';document.getElementById('next').classList.remove('hidden');localStorage.setItem('shiki019','1')}</script></body></html>
