</head><body><div class="achievement" id="achievement"><small>ACHIEVEMENT 20　獲得</small><strong>誰が帰還したのか</strong><span>SHIKI-019の帰還照合を完了した。</span></div><main><div class="box"><small>N.I.U. / CONFIDENTIAL ARCHIVE</small><div class="sigil">❦</div><h1>資料番号 SHIKI-019</h1><h2>帰還者について</h2><p>――誰が帰還したのか。</p><p>SHIKI-018の黒塗り資料をすべて復元した閲覧者へ。</p><p>記録上、帰還した者は一名。</p><p id="name">しかし、名前は記録されていない。</p><button onclick="r()">記録を照合する</button><div id="next" class="hidden"><hr><p>照合結果：<strong>花葉雛菊</strong>――ただし、人格記録は一致しません。</p><p><strong>RETURN / 0000</strong></p><p>「帰還」は人物の移動を意味しない。</p><p>失われたものが、元の記録へ戻ること。</p><p>……では、戻ってきたのは誰なのか。</p><a href="index.html">帝國大學首頁へ戻る</a></div></div></main><script>function r(){document.getElementById('name').textContent='照合結果：花葉雛菊――ただし、人格記録は一致しません。';document.getElementById('next').classList.remove('hidden');if(localStorage.getItem('achievement20')!=='1'){localStorage.setItem('achievement20','1');const a=document.getElementById('achievement');a.classList.add('show');setTimeout(()=>a.classList.remove('show'),5200)}localStorage.setItem('shiki019','1')}</script></body></html>
