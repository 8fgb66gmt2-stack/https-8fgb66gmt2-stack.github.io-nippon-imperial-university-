name: Integrate Night Archive Door

on:
  push:
    branches:
      - '日ノ本帝國國立帝國大學公式サイト'

permissions:
  contents: write

jobs:
  integrate-night-door:
    if: ${{ !contains(github.event.head_commit.message, '第六章への夜間モード扉を自動統合') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '日ノ本帝國國立帝國大學公式サイト'
          fetch-depth: 1

      - name: Inject Night Archive door
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<!-- NIGHT-ARCHIVE-DOOR -->'
          if marker in html:
              print('Night Archive door already exists; nothing to do.')
              raise SystemExit(0)

          block = r'''<!-- NIGHT-ARCHIVE-DOOR -->
<style>
#nightArchiveDoor{
  position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#171313 0%,#090707 72%,#030303 100%);
  color:#eadfcf;opacity:0;transition:opacity .9s ease;cursor:default;
}
#nightArchiveDoor.show{display:flex;opacity:1}
#nightArchiveDoor .nad-frame{width:min(720px,88vw);padding:clamp(28px,7vw,64px);border:1px solid #a47f3b;box-shadow:0 0 0 8px rgba(164,127,59,.04),0 25px 80px rgba(0,0,0,.65);text-align:center;position:relative}
#nightArchiveDoor .nad-kicker{font-size:9px;letter-spacing:.42em;color:#bfa66d;margin-bottom:18px}
#nightArchiveDoor h2{font-family:"Shippori Mincho","Noto Serif JP",serif;font-size:clamp(26px,6vw,48px);font-weight:700;letter-spacing:.18em;margin:0 0 20px;color:#eee3d1}
#nightArchiveDoor p{font-family:"Noto Serif JP",serif;font-size:12px;line-height:2.25;color:#cfc4b5;margin:8px 0}
#nightArchiveDoor .nad-warning{margin:24px auto;padding:16px;border-top:1px solid rgba(164,127,59,.35);border-bottom:1px solid rgba(164,127,59,.35);color:#d8c59c;font-size:11px;letter-spacing:.12em}
#nightArchiveDoor .nad-enter{display:inline-block;margin-top:18px;padding:12px 30px;border:1px solid #a47f3b;background:transparent;color:#e8d7b4;font-family:inherit;font-size:11px;letter-spacing:.18em;cursor:pointer;transition:.3s}
#nightArchiveDoor .nad-enter:hover{background:#a47f3b;color:#171313}
#nightArchiveDoor .nad-close{position:absolute;right:14px;top:10px;background:none;border:0;color:#8d8278;font-size:18px;cursor:pointer}
#nightArchiveToast{position:fixed;right:18px;bottom:18px;z-index:11999;display:none;padding:12px 16px;border:1px solid rgba(164,127,59,.7);background:#171313;color:#d9c79d;font-size:10px;letter-spacing:.12em;box-shadow:0 8px 30px rgba(0,0,0,.35)}
</style>

<div id="nightArchiveDoor" aria-hidden="true">
  <div class="nad-frame">
    <button class="nad-close" type="button" aria-label="閉じる">×</button>
    <div class="nad-kicker">IMPERIAL UNIVERSITY / NIGHT ARCHIVE</div>
    <h2>第六章　夜間モード</h2>
    <p>日中の閲覧記録には存在しない資料があります。</p>
    <p>この先は、大学が公開していない「夜間閲覧記録」です。</p>
    <div class="nad-warning">閲覧資格を確認しました。　――　扉は、今夜だけ開きます。</div>
    <button class="nad-enter" type="button">夜間資料室を開く</button>
  </div>
</div>
<div id="nightArchiveToast">夜間閲覧記録を検知しました。</div>

<script>
(function(){
  const door=document.getElementById('nightArchiveDoor');
  const toast=document.getElementById('nightArchiveToast');
  if(!door) return;

  function openDoor(){
    door.style.display='flex';
    requestAnimationFrame(()=>door.classList.add('show'));
    door.setAttribute('aria-hidden','false');
    localStorage.setItem('night_archive_detected','1');
  }
  function closeDoor(){
    door.classList.remove('show');
    setTimeout(()=>{door.style.display='none';},900);
    door.setAttribute('aria-hidden','true');
  }

  document.addEventListener('click',function(e){
    const target=e.target.closest('button,a,[role="button"],input,label,summary');
    if(!target) return;
    const text=(target.textContent||target.getAttribute('aria-label')||target.getAttribute('title')||'').replace(/\s/g,'');
    if(/夜間モード|夜間|nightmode|night-mode/i.test(text)){
      setTimeout(()=>{
        toast.style.display='block';
        setTimeout(()=>toast.style.display='none',2600);
        openDoor();
      },350);
    }
  },true);

  door.querySelector('.nad-close').addEventListener('click',closeDoor);
  door.querySelector('.nad-enter').addEventListener('click',function(){
    window.location.href='chapter6.html';
  });

  door.addEventListener('click',function(e){
    if(e.target===door) closeDoor();
  });
})();
</script>
'''

          closing = '</body>'
          if closing not in html:
              raise SystemExit('index.html に </body> が見つかりません。')

          html = html.replace(closing, block + '\n' + closing, 1)
          path.write_text(html, encoding='utf-8')
          print('Night Archive door injected into index.html')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '第六章への夜間モード扉を自動統合'
          git push origin '日ノ本帝國國立帝國大學公式サイト'
