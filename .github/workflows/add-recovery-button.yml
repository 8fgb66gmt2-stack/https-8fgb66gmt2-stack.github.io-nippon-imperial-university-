name: Add archive recovery button

on:
  push:
    paths:
      - '.github/recovery-button.trigger'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add archive recovery button to index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n/* =========================================================\n   過去ログ回収ボタン\n========================================================= */\n#archiveRecoveryButton {\n    position: fixed;\n    top: 18px;\n    right: 20px;\n    z-index: 9000;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    min-height: 40px;\n    padding: 8px 16px;\n    border: 1px solid var(--gold);\n    background: rgba(40,28,27,.94);\n    color: var(--gold-light);\n    font-size: 10px;\n    letter-spacing: .12em;\n    box-shadow: 0 5px 18px rgba(30,18,15,.22);\n    backdrop-filter: blur(4px);\n    transition: .25s ease;\n}\n#archiveRecoveryButton:hover {\n    background: var(--gold);\n    color: var(--black);\n    transform: translateY(-1px);\n}\n@media (max-width: 600px) {\n    #archiveRecoveryButton {\n        top: 10px;\n        right: 10px;\n        min-height: 36px;\n        padding: 6px 10px;\n        font-size: 9px;\n    }\n}\n'''

          html = '''\n<a id="archiveRecoveryButton" href="archive-recovery.html" aria-label="過去ログ回収室を開く">\n    過去ログ回収\n</a>\n'''

          if 'id="archiveRecoveryButton"' not in s:
              marker = '</style>'
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, css + '\n' + marker, 1)

              body_marker = '</body>'
              if body_marker not in s:
                  raise SystemExit('body marker not found')
              s = s.replace(body_marker, html + '\n' + body_marker, 1)

              p.write_text(s, encoding='utf-8')
          else:
              print('button already present; no change')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add archive recovery button to homepage"
          git push
