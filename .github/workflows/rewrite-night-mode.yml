name: Rewrite night mode truth

on:
  push:
    paths:
      - .github/night-mode-patch.txt
      - .github/workflows/rewrite-night-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Chapter 6 truth layer
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "<!-- NIGHT-TRUTH-INJECTED-2026 -->"
          if marker in s:
              print("already injected")
              raise SystemExit(0)

          injection = r'''<!-- NIGHT-TRUTH-INJECTED-2026 -->
<style>
#nightTruthLayer{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,2,4,.9);backdrop-filter:blur(8px)}
#nightTruthLayer.open{display:flex}
#nightTruthWindow{width:min(900px,96vw);max-height:90vh;overflow:auto;position:relative;padding:38px;color:#e9dfd0;background:linear-gradient(145deg,#171217,#09070a);border:1px solid #a98545;box-shadow:0 25px 90px #000}
#nightTruthWindow h2{font-family:"Shippori Mincho",serif;color:#e2c27b;letter-spacing:.14em;font-size:clamp(28px,5vw,48px);margin:8px 0 18px}
#nightTruthWindow .nt-k{font-size:9px;letter-spacing:.32em;color:#c8a766}
#nightTruthWindow .nt-lead{font-size:12px;line-height:2.3;color:#c8bbae}
#nightTruthWindow .nt-line{height:1px;background:linear-gradient(90deg,#781722,#a98545,transparent);margin:22px 0}
#nightTruthWindow .nt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
#nightTruthWindow .nt-card{padding:16px;border:1px solid rgba(169,133,69,.3);background:rgba(255,255,255,.025)}
#nightTruthWindow .nt-card b{color:#e2c27b;font-family:"Shippori Mincho",serif;font-size:16px}
#nightTruthWindow .nt-card p{font-size:10px;line-height:2;color:#bfb2a5;margin:7px 0 0}
#nightTruthClose{position:absolute;right:12px;top:6px;border:0;background:none;color:#d8b56e;font-size:28px;cursor:pointer}
#nightTruthTerminal{margin-top:20px;padding:16px;background:#050506;border:1px solid #4b3a25;color:#d9c38f;font:11px/2 ui-monospace,SFMono-Regular,monospace}
#nightTruthTerminal input{width:150px;background:transparent;border:0;border-bottom:1px solid #a98545;color:#f1dfb0;outline:none;font:inherit}
#nightTruthTerminal button{border:1px solid #a98545;background:transparent;color:#e6d3a5;padding:5px 12px;cursor:pointer;font:inherit}
#nightTruthResult{margin-top:14px;padding:14px;border-left:3px solid #a98545;color:#e3d5c6;line-height:2;min-height:40px}
@media(max-width:650px){#nightTruthWindow{padding:28px 18px}.nt-grid{grid-template-columns:1fr!important}}
</style>
<div id="nightTruthLayer" aria-hidden="true">
 <div id="nightTruthWindow" role="dialog" aria-modal="true">
  <button id="nightTruthClose" type="button">×</button>
  <div class="nt-k">N.I.U. / NIGHT ACCESS / ARCHIVE 06</div>
  <h2>第六章　夜間モード</h2>
  <p class="nt-lead">夜間モードは、ただの配色変更ではない。昼間の公式記録から切り離された旧式の夜間閲覧層が、まだ大学の奥に残されている。</p>
  <div class="nt-line"></div>
  <div class="nt-grid">
   <div class="nt-card"><b>神代文庫</b><p>旧目録「M. D.」と神代聖の署名が、同じ資料群の中に残されている。</p></div>
   <div class="nt-card"><b>紅城院眞紅</b><p>『吸血鬼ミフネア』初稿には「彼はまだ、生きてゐる」と記されている。</p></div>
   <div class="nt-card"><b>ミフネア</b><p>眞紅が記録した、過去を忘れることのできない者。</p></div>
   <div class="nt-card"><b>卜部川樒</b><p>死について書きながら、神代聖の「過去」に触れていた文士。</p></div>
  </div>
  <div id="nightTruthTerminal">&gt; NIGHT ARCHIVE AUTHENTICATION<br>&gt; password: <input id="nightTruthPass" autocomplete="off" spellcheck="false"><button id="nightTruthSubmit" type="button">認証</button><div style="margin-top:7px;color:#806d50">ヒント：第二章で「M. D.」に対応するとされた古い呼び名。</div></div>
  <div id="nightTruthResult">夜間閲覧層、待機中……</div>
 </div>
</div>
<script>
(()=>{
 const layer=document.getElementById('nightTruthLayer');
 const close=document.getElementById('nightTruthClose');
 const pass=document.getElementById('nightTruthPass');
 const submit=document.getElementById('nightTruthSubmit');
 const result=document.getElementById('nightTruthResult');
 const toggle=document.getElementById('nightToggle');
 if(!toggle)return;
 const open=()=>{layer.classList.add('open');layer.setAttribute('aria-hidden','false')};
 const shut=()=>{layer.classList.remove('open');layer.setAttribute('aria-hidden','true')};
 toggle.addEventListener('click',open);
 close.addEventListener('click',shut);
 layer.addEventListener('click',e=>{if(e.target===layer)shut()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
 const auth=()=>{const v=pass.value.trim().replace(/\s/g,'');if(v==='ミフネア'||v.toUpperCase()==='MIFUNEA'){result.innerHTML='<strong style="color:#e2c27b">認証一致。</strong><br><br>旧式閲覧網が開きました。<br><br><span style="font-family:serif;font-size:18px;color:#e2c27b">「彼が大学へ来るより前から、彼の本はここにあった。」</span><br><br>神代聖、紅城院眞紅、ミフネア、卜部川樒――四つの記録は、ここで初めて一つの謎として接続される。<br><br><strong style="color:#e2c27b">第六章・真相層　解錠。</strong>';localStorage.setItem('imperialNightTruth','1')}else{result.textContent='認証拒否。旧目録「M. D.」に記された古い呼び名を入力してください。'}};
 submit.addEventListener('click',auth);pass.addEventListener('keydown',e=>{if(e.key==='Enter')auth()});
})();
</script>
'''
          s = s.replace('</body>', injection + '</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patched homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "第六章 夜間モードを真相層へ直接接続"
          git push