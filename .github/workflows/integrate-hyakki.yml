name: Integrate Hyakki Archive

on:
  push:
    paths:
      - 'hyakki.html'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[hyakki-integrated]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate archive entry into index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'href="hyakki.html"'
          if marker in s:
              print('Hyakki link already integrated.')
              raise SystemExit(0)

          nav = '''<a href="hyakki.html" class="hyakki-nav-link">『彼岸奇譚』帝國大百科</a>'''
          if '<div class="main-nav-inner">' in s:
              s = s.replace('<div class="main-nav-inner">', '<div class="main-nav-inner">' + nav, 1)

          block = r'''
<section class="section hyakki-entry" id="hyakki-entry">
  <div class="section-heading">
    <div class="section-kicker">附属圖書館・參考資料</div>
    <h2 class="section-title">『彼岸奇譚』帝國大百科</h2>
    <div class="section-rule"></div>
    <p class="section-description">帝國の諸制度、四季神祇、帝都文化、帝國大學、そして帝國近代の文化人を記録した帝國勅撰の百科事典。公開資料との照合を通じて、旧記録の一部を閲覧できます。</p>
    <a class="hero-button" href="hyakki.html">帝國大百科を閲覧する</a>
  </div>
  <div class="hyakki-clues">
    <span>春の不在</span><span>四季庁</span><span>神痣</span><span>文星</span><span>卜部川樒</span>
  </div>
  <p class="hyakki-note">※本資料には、公開記録と一致しない旧資料が含まれています。</p>
</section>
<style>
.hyakki-entry{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(223,209,188,.35));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hyakki-clues{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:-22px}
.hyakki-clues span{border:1px solid var(--line);padding:5px 12px;font-size:10px;letter-spacing:.08em;color:var(--red);background:rgba(255,255,255,.35)}
.hyakki-note{text-align:center;color:var(--ink-soft);font-size:10px;margin-top:18px}
.hyakki-nav-link{color:var(--gold-light)!important}
</style>
'''
          if 'id="hyakki-entry"' not in s:
              s = s.replace('</body>', block + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit integrated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Integrate 『彼岸奇譚』 into university ARG [hyakki-integrated]'
          git push
