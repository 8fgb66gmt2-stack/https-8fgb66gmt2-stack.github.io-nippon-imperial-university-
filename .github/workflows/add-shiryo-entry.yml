name: Add Imperial University Archive Room entry

on:
  push:
    paths:
      - '.github/workflows/add-shiryo-entry.yml'
      - '.github/trigger-shiryo-entry'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible archive-room and Hyakki entries to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<!-- ARCHIVE 16 entry -->'
          archive_entry = '''<!-- 帝國大學資料室 entry -->
          <a href="shiryo-shitsu.html" style="position:fixed;left:18px;bottom:132px;z-index:9999;padding:10px 16px;border:1px solid #a98545;background:#241918;color:#dbc48e;font-family:serif;font-size:11px;letter-spacing:.12em;box-shadow:0 4px 15px rgba(36,25,24,.18);">帝國大學資料室</a>
          <!-- /帝國大學資料室 entry -->
          '''
          if 'href="shiryo-shitsu.html"' not in s:
              if marker not in s:
                  raise SystemExit('ARCHIVE 16 marker not found; refusing to modify index.html')
              s = s.replace(marker, archive_entry + marker, 1)

          hyakki_entry = '''<!-- 『彼岸奇譚』帝國大百科 entry -->
          <section class="section hyakki-entry" id="hyakki-entry">
            <div class="section-heading">
              <div class="section-kicker">附属圖書館・參考資料</div>
              <h2 class="section-title">『彼岸奇譚』帝國大百科</h2>
              <div class="section-rule"></div>
              <p class="section-description">帝國の諸制度、四季神祇、帝都文化、帝國大學、そして帝國近代の文化人を記録した帝國勅撰の百科事典。公開資料との照合を通じて、旧記録の一部を閲覧できます。</p>
              <a class="hero-button" href="hyakki.html">帝國大百科を閲覧する</a>
            </div>
            <div class="hyakki-clues"><span>春の不在</span><span>四季庁</span><span>神痣</span><span>文星</span><span>卜部川樒</span></div>
            <p class="hyakki-note">※本資料には、公開記録と一致しない旧資料が含まれています。</p>
          </section>
          <style>
          .hyakki-entry{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(223,209,188,.35));border-top:1px solid #a98545;border-bottom:1px solid rgba(74,47,35,.24)}
          .hyakki-clues{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:-22px}.hyakki-clues span{border:1px solid rgba(74,47,35,.24);padding:5px 12px;font-size:10px;letter-spacing:.08em;color:#781722;background:rgba(255,255,255,.35)}.hyakki-note{text-align:center;color:#665854;font-size:10px;margin-top:18px}
          </style>
          <!-- /『彼岸奇譚』帝國大百科 entry -->
          '''
          if 'href="hyakki.html"' not in s:
              if '</body>' not in s:
                  raise SystemExit('body marker not found; refusing to modify index.html')
              s = s.replace('</body>', hyakki_entry + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change needed.'
          else
            git commit -m "Add Hyakki archive entry to homepage"
            git push
          fi
