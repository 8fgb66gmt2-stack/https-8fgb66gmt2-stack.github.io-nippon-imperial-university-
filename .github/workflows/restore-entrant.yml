name: Restore full index and install entrant registration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-entrant.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original full index and inject entrant registration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='d63b3a0d897e8d3374b5ac7d2bbda2ad6184606a'
          original=subprocess.check_output(['git','show',f'{base}:index.html'], text=True)
          marker='''        <div class="entrance-line"></div>\n'''
          insert='''        <div class="entrance-line"></div>\n\n        <div class="entrant-registration" aria-label="入學者登録">\n            <label for="entrant-name">入學者登録</label>\n            <input id="entrant-name" name="entrant-name" type="text" maxlength="24" autocomplete="off" placeholder="氏名を入力してください" aria-label="入學者名">\n            <div class="entrant-note">記録はこの端末にのみ保存されます</div>\n        </div>\n'''
          if marker not in original:
              raise SystemExit('entrance marker not found')
          html=original.replace(marker, insert, 1)
          css='''\n<style id="entrant-registration-style">\n.entrant-registration{width:min(330px,82vw);margin:0 auto 18px;text-align:left}.entrant-registration label{display:block;text-align:center;margin-bottom:8px;color:#d7c8b3;font-size:9px;letter-spacing:.24em}.entrant-registration input{display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #a98545;background:rgba(0,0,0,.28);color:#f5ead8;text-align:center;font-family:inherit;font-size:14px;outline:none}.entrant-registration input::placeholder{color:#b8aa99;opacity:.9}.entrant-registration input:focus{border-color:#dbc48e;box-shadow:0 0 0 2px rgba(219,196,142,.18)}.entrant-note{text-align:center;margin-top:7px;color:#b9aa98;font-size:8px;letter-spacing:.08em;line-height:1.6}.entrant-registration.invalid input{border-color:#dbc48e;animation:entrantShake .22s linear 2}@keyframes entrantShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@media(max-width:560px){.entrant-registration{width:min(300px,82vw)}.entrant-registration input{font-size:16px;padding:12px}}\n</style>\n'''
          html=html.replace('</head>', css+'\n</head>', 1)
          js='''\n<script src="profile-slots.js"></script>\n<script id="entrant-registration-script">\n(function(){const KEY='niu_entrant_name',input=document.getElementById('entrant-name'),button=document.getElementById('enterButton');if(!input||!button)return;const saved=localStorage.getItem(KEY);if(saved)input.value=saved;function enter(){const name=input.value.trim();if(!name){input.closest('.entrant-registration')?.classList.add('invalid');input.focus();setTimeout(()=>input.closest('.entrant-registration')?.classList.remove('invalid'),600);return}localStorage.setItem(KEY,name);if(window.NIUProfiles)window.NIUProfiles.activate(name);document.dispatchEvent(new CustomEvent('niu:entrant-registered',{detail:{name}}));document.getElementById('entrance')?.classList.add('hide')}input.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});button.addEventListener('click',enter)})();\n</script>\n'''
          html=html.replace('</body>', js+'\n</body>', 1)
          Path('index.html').write_text(html,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: activate entrant profile before ARG progress is read'
          git push
