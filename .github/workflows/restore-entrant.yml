name: Restore full index and install entrant registration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-entrant.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original full index and inject entrant registration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='d63b3a0d897e8d3374b5ac7d2bbda2ad6184606a'
          original=subprocess.check_output(['git','show',f'{base}:index.html'], text=True)
          marker='''        <div class="entrance-line"></div>\n'''
          insert='''        <div class="entrance-line"></div>\n\n        <div class="entrant-registration" aria-label="入學者登録">\n            <label for="entrant-name">入學者登録</label>\n            <input id="entrant-name" name="entrant-name" type="text" maxlength="24" autocomplete="off" placeholder="氏名を入力してください" aria-label="入學者名">\n            <div class="entrant-note">記録はこの端末にのみ保存されます</div>\n        </div>\n'''
          if marker not in original:
              raise SystemExit('entrance marker not found')
          html=original.replace(marker, insert, 1)
          css='''\n<style id="entrant-registration-style">\n.entrant-registration{width:min(330px,82vw);margin:0 auto 18px;text-align:left}\n.entrant-registration label{display:block;text-align:center;margin-bottom:8px;color:#d7c8b3;font-size:9px;letter-spacing:.24em}\n.entrant-registration input{display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #a98545;background:rgba(0,0,0,.28);color:#f5ead8;text-align:center;font-family:inherit;font-size:14px;outline:none}\n.entrant-registration input::placeholder{color:#b8aa99;opacity:.9}\n.entrant-registration input:focus{border-color:#dbc48e;box-shadow:0 0 0 2px rgba(219,196,142,.18)}\n.entrant-note{text-align:center;margin-top:7px;color:#b9aa98;font-size:8px;letter-spacing:.08em;line-height:1.6}\n.entrant-registration.invalid input{border-color:#dbc48e;animation:entrantShake .22s linear 2}\n@keyframes entrantShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}\n@media(max-width:560px){.entrant-registration{width:min(300px,82vw)}.entrant-registration input{font-size:16px;padding:12px}}\n</style>\n'''
          html=html.replace('</head>', css+'\n</head>', 1)
          js='''\n<script id="entrant-registration-script">\n(function(){\n  const KEY='niu_entrant_name';\n  const input=document.getElementById('entrant-name');\n  const button=document.getElementById('enterButton');\n  if(!input || !button) return;\n  const saved=localStorage.getItem(KEY);\n  if(saved) input.value=saved;\n  function enter(){\n    const name=input.value.trim();\n    if(!name){\n      input.closest('.entrant-registration')?.classList.add('invalid');\n      input.focus();\n      setTimeout(()=>input.closest('.entrant-registration')?.classList.remove('invalid'),600);\n      return;\n    }\n    localStorage.setItem(KEY,name);\n    document.dispatchEvent(new CustomEvent('niu:entrant-registered',{detail:{name}}));\n    document.getElementById('entrance')?.classList.add('hide');\n  }\n  input.addEventListener('keydown',e=>{if(e.key==='Enter') enter();});\n  button.addEventListener('click',enter);\n})();\n</script>\n'''
          html=html.replace('</body>', js+'\n</body>', 1)
          Path('index.html').write_text(html,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-entrant.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore full university site and add visible entrant registration'
          git push
