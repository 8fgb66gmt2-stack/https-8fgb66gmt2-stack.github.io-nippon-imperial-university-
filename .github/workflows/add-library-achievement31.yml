name: Add Achievement 31 to Imperial Library Search

on:
  push:
    paths:
      - '.github/workflows/add-library-achievement31.yml'
      - '.github/library31.trigger'

permissions:
  contents: write

jobs:
  patch-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 日ノ本帝國國立帝國大學公式サイト

      - name: Patch library search room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- ACHIEVEMENT31_LIBRARY_PATCH -->'
          if marker in text:
              print('Achievement 31 library patch already present.')
              raise SystemExit(0)

          patch = r'''\n<!-- ACHIEVEMENT31_LIBRARY_PATCH -->\n<style>\n#achievement31-library-result { display:none; margin-top:22px; padding:24px 26px; border:1px solid rgba(169,133,69,.55); background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(226,215,197,.55)); box-shadow:0 8px 25px rgba(50,35,25,.08); }\n#achievement31-library-result.show { display:block; animation:achievement31Fade .45s ease; }\n#achievement31-library-result .a31-kicker { color:#781722; font-size:10px; letter-spacing:.28em; margin-bottom:7px; }\n#achievement31-library-result h4 { margin:0 0 8px; font-family:"Shippori Mincho","Noto Serif JP",serif; font-size:19px; letter-spacing:.08em; }\n#achievement31-library-result p { margin:5px 0; font-size:12px; line-height:2; }\n#achievement31-library-result .a31-note { color:#665854; }\n#achievement31-library-result a { display:inline-block; margin-top:12px; padding:9px 20px; border:1px solid #a98545; color:#4c0d14; font-size:11px; letter-spacing:.12em; transition:.25s ease; }\n#achievement31-library-result a:hover { background:#a98545; color:#241918; }\n@keyframes achievement31Fade { from {opacity:0; transform:translateY(7px)} to {opacity:1; transform:translateY(0)} }\n</style>\n<script>\n(function(){\n  const terms = ['記','記憶','記憶論'];\n  const normalize = s => (s || '').replace(/\\s+/g,'').trim();\n  function install(){\n    const inputs = Array.from(document.querySelectorAll('input')).filter(el => /検索語|検索/.test(el.placeholder || '') || /library|search/i.test(el.id || '') || /library|search/i.test(el.name || ''));\n    if(!inputs.length) return false;\n    const input = inputs[0];\n    const host = input.closest('form') || input.parentElement;\n    if(!host) return false;\n    let result = document.getElementById('achievement31-library-result');\n    if(!result){\n      result = document.createElement('div');\n      result.id = 'achievement31-library-result';\n      result.innerHTML = `<div class="a31-kicker">帝國圖書検索室・秘匿資料</div><h4>『記憶論――人は何故、忘れるのか』</h4><p><strong>帝國大學文科旧蔵書</strong></p><p>請求記號：SH-000　／　閲覧状態：一部欠落</p><p class="a31-note">本資料には、公開目録と一致しない欠落頁があります。</p><a href="archive31.html">資料詳細を開く　―　SH-000</a>`;\n      host.insertAdjacentElement('afterend', result);\n    }\n    const reveal = () => { const q = normalize(input.value); const hit = terms.some(t => q === t || q.includes(t)); result.classList.toggle('show', hit); };\n    input.addEventListener('input', reveal);\n    input.addEventListener('change', reveal);\n    const form = input.closest('form');\n    if(form) form.addEventListener('submit', function(){ setTimeout(reveal, 0); });\n    return true;\n  }\n  if(!install()){ const observer = new MutationObserver(() => { if(install()) observer.disconnect(); }); observer.observe(document.documentElement, {childList:true, subtree:true}); setTimeout(() => observer.disconnect(), 10000); }\n})();\n</script>\n'''
          if '</body>' in text:
              text = text.replace('</body>', patch + '\n</body>', 1)
          else:
              text += patch
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: connect library search to achievement 31'
            git push origin '日ノ本帝國國立帝國大學公式サイト'
          fi
