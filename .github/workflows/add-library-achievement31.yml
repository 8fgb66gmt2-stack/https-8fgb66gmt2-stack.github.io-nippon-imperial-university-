name: Add Achievement 31 to Imperial Library Search

on:
  push:
    paths:
      - '.github/workflows/add-library-achievement31.yml'

permissions:
  contents: write

jobs:
  patch-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 日ノ本帝國國立帝國大學公式サイト

      - name: Patch library search room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- ACHIEVEMENT31_LIBRARY_PATCH -->'
          if marker in text:
              print('Achievement 31 library patch already present.')
              raise SystemExit(0)

          patch = r'''\n<!-- ACHIEVEMENT31_LIBRARY_PATCH -->\n<style>\n#achievement31-library-result {\n  display:none;\n  margin-top:22px;\n  padding:24px 26px;\n  border:1px solid rgba(169,133,69,.55);\n  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(226,215,197,.55));\n  box-shadow:0 8px 25px rgba(50,35,25,.08);\n}\n#achievement31-library-result.show { display:block; animation:achievement31Fade .45s ease; }\n#achievement31-library-result .a31-kicker {\n  color:#781722; font-size:10px; letter-spacing:.28em; margin-bottom:7px;\n}\n#achievement31-library-result h4 {\n  margin:0 0 8px; font-family:"Shippori Mincho","Noto Serif JP",serif;\n  font-size:19px; letter-spacing:.08em;\n}\n#achievement31-library-result p { margin:5px 0; font-size:12px; line-height:2; }\n#achievement31-library-result .a31-note { color:#665854; }\n#achievement31-library-result a {\n  display:inline-block; margin-top:12px; padding:9px 20px;\n  border:1px solid #a98545; color:#4c0d14; font-size:11px; letter-spacing:.12em;\n  transition:.25s ease;\n}\n#achievement31-library-result a:hover { background:#a98545; color:#241918; }\n@keyframes achievement31Fade { from {opacity:0; transform:translateY(7px)} to {opacity:1; transform:translateY(0)} }\n</style>\n<script>\n(function(){\n  const terms = ['記','記憶','記憶論'];\n  const normalize = s => (s || '').replace(/\\s+/g,'').trim();\n\n  function install(){\n    const inputs = Array.from(document.querySelectorAll('input')).filter(el =>\n      /検索語|検索/.test(el.placeholder || '') || /library|search/i.test(el.id || '') || /library|search/i.test(el.name || '')\n    );\n    if(!inputs.length) return false;\n\n    const input = inputs[0];\n    let host = input.closest('form') || input.parentElement;\n    if(!host) return false;\n    let result = document.getElementById('achievement31-library-result');\n    if(!result){\n      result = document.createElement('div');\n      result.id = 'achievement31-library-result';\n      result.innerHTML = `\n        <div class="a31-kicker">帝國圖書検索室・秘匿資料</div>\n        <h4>『記憶論――人は何故、忘れるのか』</h4>\n        <p><strong>帝國大學文科旧蔵書</strong></p>\n        <p>請求記號：SH-000　／　閲覧状態：一部欠落</p>\n        <p class="a31-note">本資料には、公開目録と一致しない欠落頁があります。</p>\n        <a href="archive31.html">資料詳細を開く　―　SH-000</a>`;\n      host.insertAdjacentElement('afterend', result);\n    }\n\n    const reveal = () => {\n      const q = normalize(input.value);\n      const hit = terms.some(t => q === t || q.includes(t));\n      result.classList.toggle('show', hit);\n    };\n    input.addEventListener('input', reveal);\n    input.addEventListener('change', reveal);\n    const form = input.closest('form');\n    if(form) form.addEventListener('submit', function(){ setTimeout(reveal, 0); });\n    return true;\n  }\n\n  if(!install()) {\n    const observer = new MutationObserver(() => { if(install()) observer.disconnect(); });\n    observer.observe(document.documentElement, {childList:true, subtree:true});\n    setTimeout(() => observer.disconnect(), 10000);\n  }\n})();\n</script>\n'''

          if '</body>' in text:
              text = text.replace('</body>', patch + '\n</body>', 1)
          else:
              text += patch

          path.write_text(text, encoding='utf-8')
          print('Achievement 31 library search patch inserted.')
          PY

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: connect library search to achievement 31'
            git push origin '日ノ本帝國國立帝國大學公式サイト'
          fi
