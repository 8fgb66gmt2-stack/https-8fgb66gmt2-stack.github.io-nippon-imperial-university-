name: Fix Night Mode Chapter 6

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-night-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Chapter 6 gateway
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<!-- CHAPTER6-NIGHT-GATE-V2 -->'
          if marker not in s:
              patch = r'''<!-- CHAPTER6-NIGHT-GATE-V2 -->
<style>
#chapter6Gate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,4,5,.9);backdrop-filter:blur(8px)}
#chapter6Gate .box{width:min(620px,94vw);padding:34px 28px;background:#100d0d;border:1px solid #b69a61;box-shadow:0 25px 90px #000;color:#e9dfd1;text-align:center;font-family:"Noto Serif JP",serif}
#chapter6Gate .kicker{font-size:9px;letter-spacing:.3em;color:#b69a61}
#chapter6Gate h2{font-family:"Shippori Mincho",serif;color:#eee5d7;letter-spacing:.12em;margin:12px 0 20px}
#chapter6Gate p{font-size:12px;line-height:2.1}
#chapter6Gate button{margin:6px;padding:12px 24px;border:1px solid #b69a61;background:#171311;color:#d9c38f;font-family:inherit;cursor:pointer}
#chapter6Gate button:hover{background:#781722;color:#fff3df}
</style>
<script>
(function(){
  function install(){
    var b=document.getElementById('nightToggle');
    if(!b || b.dataset.chapter6GateInstalled==='1') return;
    b.dataset.chapter6GateInstalled='1';
    b.addEventListener('click',function(e){
      e.preventDefault();
      e.stopImmediatePropagation();
      document.body.classList.add('night');
      localStorage.setItem('imperialNight','on');
      var old=document.getElementById('chapter6Gate');
      if(old) old.remove();
      var g=document.createElement('div');
      g.id='chapter6Gate';
      g.innerHTML='<div class="box"><div class="kicker">N.I.U. / NIGHT ARCHIVE N-00</div><h2>第六章　夜間モード</h2><p>夜間記録への接続を確認しました。</p><p>通常公開記録では秘匿された資料が存在します。</p><button id="chapter6Open">秘匿記録を開く</button><button id="chapter6Close">閉じる</button></div>';
      document.body.appendChild(g);
      document.getElementById('chapter6Open').onclick=function(){location.href='./chapter6.html';};
      document.getElementById('chapter6Close').onclick=function(){g.remove();};
    },true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();
})();
</script>
'''
              s = s.replace('</body>', patch + '</body>', 1) if '</body>' in s else s + patch
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes required.'
          else
            git commit -m 'Add reliable Chapter 6 night mode gateway'
            git push
          fi
