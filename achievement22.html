<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22記録｜研究対象</title><style>body{background:#0b0b0b;color:#d9cfbd;font-family:serif;padding:45px;max-width:760px;margin:auto}main{border:1px solid #80653e;padding:30px;background:#151311}.red{color:#bd6871}.gold{color:#c6a45e}input,button{padding:11px}</style><main><small>中央研究資料室｜閲覧制限：最高</small><h1>第22記録　研究対象</h1><p>地下資料室の全鍵を確認した。</p><p class="red">ここから先は、閲覧者を対象として記録する。</p><p>研究対象名を入力せよ。</p><input id="n" placeholder="名前"><button onclick="c()">登録</button><div id="o"></div></main><script>function c(){let v=n.value.trim();if(!v)return;o.innerHTML='<hr><p>登録完了。</p><p class="gold">研究対象：'+v.replace(/[<>]/g,'')+'</p><p>分類：大学外部からの侵入的閲覧者</p><p>備考：本記録を閲覧した時点で、対象は既に本学の資料となっている。</p><p class="red">――卒業手続きは存在しません。</p>';localStorage.setItem('achievement22','true')}</script>
